<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Reminder</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>Daily Reminder ☀️</h1>
        <p class="subtitle">Organize your day, stay productive!</p>

        <div class="reminder-box">
            <h2>Add New Task</h2>

            <input type="text" placeholder="Enter your task">

            <label>Reminder Date</label>
            <input type="date">

            <label>Reminder Time</label>
            <input type="time">

            <button>Add Reminder</button>
        </div>

        <div class="task-box">
            <h2>My Daily Tasks</h2>

            <div class="task">
                <span>📚 Complete Assignments</span>
                <span>Pending</span>
            </div>

            <div class="task">
                <span>💻 Practice Programming</span>
                <span>Pending</span>
            </div>

            <div class="task">
                <span>📝 Prepare for Exams</span>
                <span>Completed</span>
            </div>
        </div>

    </div>

</body>
</html>
